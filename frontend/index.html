<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .student-form { background: #f5f5f5; padding: 20px; margin-bottom: 20px; border-radius: 5px; }
        .student-list { background: white; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 3px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .student-item { border: 1px solid #eee; padding: 15px; margin-bottom: 10px; border-radius: 3px; }
        .student-item h3 { margin: 0 0 10px 0; color: #333; }
        .student-item p { margin: 5px 0; color: #666; }
        .delete-btn { background: #dc3545; margin-left: 10px; }
        .delete-btn:hover { background: #c82333; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [students, setStudents] = useState([]);
            const [formData, setFormData] = useState({
                studentName: '',
                email: '',
                phone: '',
                course: '',
                department: '',
                address: ''
            });
            const [editingId, setEditingId] = useState(null);

            useEffect(() => {
                fetchStudents();
            }, []);

            const fetchStudents = async () => {
                try {
                    const response = await fetch('http://localhost:8080/api/students');
                    const data = await response.json();
                    setStudents(data);
                } catch (error) {
                    console.error('Error fetching students:', error);
                }
            };

            const handleInputChange = (e) => {
                setFormData({
                    ...formData,
                    [e.target.name]: e.target.value
                });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    let response;
                    if (editingId) {
                        // Update existing student
                        response = await fetch(`http://localhost:8080/api/students/${editingId}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({...formData, id: editingId})
                        });
                    } else {
                        // Add new student
                        response = await fetch('http://localhost:8080/api/students', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(formData)
                        });
                    }
                    
                    if (response.ok) {
                        setFormData({
                            studentName: '',
                            email: '',
                            phone: '',
                            course: '',
                            department: '',
                            address: ''
                        });
                        setEditingId(null);
                        fetchStudents();
                    }
                } catch (error) {
                    console.error('Error saving student:', error);
                }
            };

            const handleEdit = (student) => {
                setFormData({
                    studentName: student.studentName,
                    email: student.email,
                    phone: student.phone,
                    course: student.course,
                    department: student.department,
                    address: student.address
                });
                setEditingId(student.id);
            };

            const handleDelete = async (id) => {
                if (window.confirm('Are you sure you want to delete this student?')) {
                    try {
                        await fetch(`http://localhost:8080/api/students/${id}`, {
                            method: 'DELETE'
                        });
                        fetchStudents();
                    } catch (error) {
                        console.error('Error deleting student:', error);
                    }
                }
            };

            const handleCancel = () => {
                setFormData({
                    studentName: '',
                    email: '',
                    phone: '',
                    course: '',
                    department: '',
                    address: ''
                });
                setEditingId(null);
            };

            return (
                <div className="container">
                    <h1>Student Management System</h1>
                    
                    <div className="student-form">
                        <h2>{editingId ? 'Edit Student' : 'Add New Student'}</h2>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label>Student Name:</label>
                                <input
                                    type="text"
                                    name="studentName"
                                    value={formData.studentName}
                                    onChange={handleInputChange}
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label>Email:</label>
                                <input
                                    type="email"
                                    name="email"
                                    value={formData.email}
                                    onChange={handleInputChange}
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label>Phone:</label>
                                <input
                                    type="tel"
                                    name="phone"
                                    value={formData.phone}
                                    onChange={handleInputChange}
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label>Course:</label>
                                <input
                                    type="text"
                                    name="course"
                                    value={formData.course}
                                    onChange={handleInputChange}
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label>Department:</label>
                                <input
                                    type="text"
                                    name="department"
                                    value={formData.department}
                                    onChange={handleInputChange}
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label>Address:</label>
                                <textarea
                                    name="address"
                                    value={formData.address}
                                    onChange={handleInputChange}
                                    rows="3"
                                    required
                                />
                            </div>
                            <div style={{display: 'flex', gap: '10px'}}>
                                <button type="submit">{editingId ? 'Update Student' : 'Add Student'}</button>
                                {editingId && <button type="button" onClick={handleCancel} style={{background: '#6c757d'}}>Cancel</button>}
                            </div>
                        </form>
                    </div>

                    <div className="student-list">
                        <h2>Student List</h2>
                        {students.length === 0 ? (
                            <p>No students found.</p>
                        ) : (
                            students.map(student => (
                                <div key={student.id} className="student-item">
                                    <h3>{student.studentName}</h3>
                                    <p><strong>Email:</strong> {student.email}</p>
                                    <p><strong>Phone:</strong> {student.phone}</p>
                                    <p><strong>Course:</strong> {student.course}</p>
                                    <p><strong>Department:</strong> {student.department}</p>
                                    <p><strong>Address:</strong> {student.address}</p>
                                    <div style={{marginTop: '10px'}}>
                                        <button 
                                            style={{background: '#28a745', marginRight: '10px'}} 
                                            onClick={() => handleEdit(student)}
                                        >
                                            Edit
                                        </button>
                                        <button 
                                            className="delete-btn" 
                                            onClick={() => handleDelete(student.id)}
                                        >
                                            Delete
                                        </button>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
